server:
  port: 8091

spring:
  application:
    name: notabene-e2ee

logging:
  level:
    id.notabene.e2ee: DEBUG
    # Every call to Notabene and its auth endpoint: request, response, status, timing.
    notabene.http: DEBUG

notabene:
  # mTLS material, see certs/README.md. Missing files = plain TLS.
  tls:
    truststore: certs/cacerts_dev.jks
    truststore-password: ${TLS_TRUSTSTORE_PASSWORD:changeit}
    cert-pem: certs/cert.pem
    key-pem: certs/key.pem
  # Notabene v2.1. Sandbox shown; production is https://eu-a.notabene.id (EU)
  # or https://us-a.notabene.id with https://us.auth.notabene.id/oauth/token (US).
  api-base: https://sandbox.notabene.id
  auth-url: https://auth.notabene.id/oauth/token
  # Defaults to api-base when blank.
  audience: ""

  # branch = one JWE per party (originator, beneficiary). This is what v2.1
  #          takes: POST /transfers/{id}/parties/{role}/encrypted-pii.
  # field  = one JWE per IVMS101 leaf value. Offline demo and local channel only.
  pii-mode: branch

  # Where keys/<vasp>.json lives. Same file format as the JavaScript project,
  # so the two can share keys. Generated on first use.
  key-dir: keys
  key-fragment: pii

  transfer:
    asset: eip155:1/slip44:60
    amount: "1.5"
    originator-address: "0x1111111111111111111111111111111111111111"
    beneficiary-address: "0x2222222222222222222222222222222222222222"

  polling:
    default-interval-seconds: 15
    limit: 25
    direction: incoming
    history-size: 50

  # Add as many as you like; /api/send names two of them.
  vasps:
    vaspA:
      did: ${VASP_A_DID:did:web:citi.com:test:us}
      client-id: ${VASP_A_CLIENT_ID:}
      client-secret: ${VASP_A_CLIENT_SECRET:}
      # Blank = derived from the DID and created in Notabene on first use.
      customer-id: ${VASP_A_CUSTOMER_ID:}
    vaspB:
      did: ${VASP_B_DID:did:web:citi.com:test:il}
      client-id: ${VASP_B_CLIENT_ID:}
      client-secret: ${VASP_B_CLIENT_SECRET:}
      customer-id: ${VASP_B_CUSTOMER_ID:}
